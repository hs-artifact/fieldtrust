<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FieldTrust</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="FieldTrust: an operational data trust platform for oil & gas and mining. Data engineering, governance, digital operations and change, in one working product.">
<meta property="og:type" content="website">
<meta property="og:title" content="FieldTrust · Operational data trust for oil & gas and mining">
<meta property="og:description" content="Reservoir-to-vessel and pit-to-shipment value chains mapped to data, with a contract-driven pipeline, live reconciliation and adoption. Synthetic data, by hs-artifact.">
<meta property="og:url" content="https://hs-artifact.github.io/fieldtrust/">
<meta property="og:image" content="https://hs-artifact.github.io/fieldtrust/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://hs-artifact.github.io/fieldtrust/og.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <aside class="rail" aria-label="Sections">
    <a class="brand" href="#overview" aria-label="FieldTrust home">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="1" y="1" width="30" height="30" rx="7" fill="none" style="stroke:var(--accent)" stroke-width="1.6"/>
        <path d="M7 22h4l3-9 4 12 3-7h4" fill="none" style="stroke:var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="25" cy="18" r="2" style="fill:var(--accent)"/>
      </svg>
      <div><div class="brand-name">FieldTrust</div><div class="brand-sub">by hs-artifact</div></div>
    </a>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot">
      <strong>Hendro S.</strong> · Data, Digital Transformation &amp; Digital Operations.<br>
      Synthetic data only. <a href="https://github.com/hs-artifact" target="_blank" rel="noopener">github.com/hs-artifact</a>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="site"><div class="site-name" id="siteName">—</div><div class="site-meta" id="siteMeta">loading…</div></div>
      <div class="seg" role="group" aria-label="Domain pack" id="domainSeg">
        <button type="button" data-domain="oil_gas" aria-pressed="true"><span class="dot"></span>Oil &amp; Gas</button>
        <button type="button" data-domain="mining" aria-pressed="false"><span class="dot"></span>Mining</button>
      </div>
      <div class="spacer"></div>
      <div class="trust-chip" title="Data trust score, last 7 days">
        <span class="lbl">Trust<br>7-day</span><span class="val num" id="trustChip">—</span><span id="trustPill"></span>
      </div>
      <button class="icon-btn" type="button" id="themeBtn" aria-label="Switch light or dark theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>
<div class="tt" id="tt" role="status" aria-live="polite"></div>
<script src="scenes.js"></script>
<script src="app.js"></script>
</body>
</html>
